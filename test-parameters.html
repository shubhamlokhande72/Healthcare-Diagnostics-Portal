<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Test Parameters</title>
<link rel="stylesheet" href="card.css">
<style>
.params-card { width:260px; border:1px solid #cccccc; border-radius:10px;
box-shadow:3px 3px 10px rgba(0,0,0,0.15); padding:15px; background-color:#ffffff; }
.params-card ul { list-style:none; padding:0; margin:0; }
.params-card ul li { padding:8px 6px; margin-bottom:6px; border-bottom:1px solid #eeeeee; }
.params-card ul li:hover { background-color:#e6f2ff; color:#003366; cursor:pointer; }
</style>
</head>
<body>

<div class="params-card">
<h2>Analytes</h2>
<ul>
<li>Glucose</li><li>Protein</li><li>Ketones</li><li>Blood</li>
<li>Bilirubin</li><li>Nitrite</li><li>Leukocytes</li>
<li>pH</li><li>Specific Gravity</li><li>Urobilinogen</li>
</ul>
</div>

<div class="param-card"><h4>Glucose</h4><p>Sugar level marker</p></div>
<div class="param-card"><h4>Protein</h4><p>Kidney function marker</p></div>
<div class="param-card"><h4>Ketones</h4><p>Metabolic marker</p></div>
<div class="param-card"><h4>pH</h4><p>Acid-base balance</p></div>

</body>
</html>
